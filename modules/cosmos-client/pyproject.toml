[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos-client"
version = "1.1"
description = "Python client SDK for the Cosmos host application"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_client"]
